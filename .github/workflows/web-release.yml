name: web release

# Packs the browser host kit (web/) into an npm tarball and attaches it to the GitHub release of
# the tag, so it can be installed before it is on npm:
#   npm install https://github.com/backkem/codelib/releases/download/web-v0.1.0/codelib-web-0.1.0.tgz
# Triggered by pushing a tag `web-v<version>` that matches web/package.json.

on:
  push:
    tags: ['web-v*']

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The tag matches the package version
        run: |
          want="web-v$(node -p 'require("./package.json").version')"
          test "$want" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json says $want"; exit 1; }

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium-headless-shell

      - name: Build and test
        run: npm test

      - name: Pack
        run: npm pack

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "codelib-web ${GITHUB_REF_NAME#web-v}" \
              --notes "The browser host kit, packed for npm: install the attached tarball by URL or vendor it (web/README.md)."
          gh release upload "$GITHUB_REF_NAME" codelib-web-*.tgz --clobber
