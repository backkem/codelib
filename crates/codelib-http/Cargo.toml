[package]
name = "codelib-http"
description = "Egress policy engine for sandboxed fetch(): host allowlists, host-side credential injection, virtual hosts, redirects, rewrites and private-IP blocking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
bytes = "1.10"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1.3"
hyper = { version = "1.7", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.17", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["net", "time", "rt"] }
tower-service = "0.3.3"
tracing = "0.1.41"
url = "2.5.4"
webpki-roots = "1.0"

[dev-dependencies]
hyper = { version = "1.7", features = ["server", "http1"] }
hyper-util = { version = "0.1.17", features = ["server", "tokio"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1.47", features = ["macros", "rt", "rt-multi-thread", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
