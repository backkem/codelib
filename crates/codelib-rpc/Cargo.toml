[package]
name = "codelib-rpc"
description = "Transport-agnostic, typed method registry and dispatcher for host calls from sandboxed scripts, with generated self-description, JS bindings and TypeScript declarations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# JSON Schemas for method arguments and results via `schemars`
# (`MethodBuilder::schema`, `args_schema`, `returns_schema`).
schema = ["dep:schemars"]
# The `Cbor` codec via `ciborium`.
cbor = ["dep:ciborium"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }

[dev-dependencies]
pollster = "0.4"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
